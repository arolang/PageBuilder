<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ <el: title> }}</title>
{{ Include the <result> from the <template: atoms/head_meta.html>. }}
    <style>
        /* Download-specific styles (extends subpage.css) */
        .download-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .download-section {
            margin-bottom: 60px;
        }

        .download-section h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .download-section h2 .icon {
            font-size: 1.4rem;
        }

        .download-section p {
            font-size: 1.1rem;
            color: var(--color-text-muted);
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 32px;
        }

        .download-card {
            background: var(--color-bg-alt);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 32px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .download-card:hover {
            transform: translateY(-4px);
            border-color: var(--color-emerald);
        }

        .download-card .platform-icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }

        .download-card h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .download-card .platform-desc {
            color: var(--color-text-muted);
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .download-card .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--gradient-primary);
            color: var(--color-text);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }

        .download-card .download-btn:hover {
            opacity: 0.9;
        }

        .download-card .download-btn svg {
            width: 16px;
            height: 16px;
        }

        .download-card .version {
            display: block;
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }

        .editor-section {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: var(--radius-md);
            padding: 40px;
            margin-top: 40px;
        }

        .editor-section h2 {
            color: var(--color-emerald);
        }

        .editor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }

        .editor-card {
            background: var(--color-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-sm);
            padding: 24px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .editor-card .editor-icon {
            font-size: 2rem;
            flex-shrink: 0;
        }

        .editor-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .editor-card p {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .editor-card .editor-link {
            color: var(--color-emerald);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .editor-card .editor-link:hover {
            text-decoration: underline;
        }

        .feature-list {
            list-style: none;
            padding: 0;
            margin: 16px 0;
        }

        .feature-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            color: var(--color-text-muted);
            font-size: 0.95rem;
        }

        .feature-list li::before {
            content: "✓";
            color: var(--color-emerald);
            font-weight: bold;
        }

        .build-source {
            background: var(--color-bg-alt);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 32px;
            margin-top: 40px;
        }

        .build-source h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .build-source code {
            font-family: var(--font-mono);
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .code-block {
            background: rgba(0, 0, 0, 0.4);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            margin: 16px 0;
            overflow-x: auto;
        }

        .code-block pre {
            margin: 0;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.6;
            color: #e2e8f0;
        }

        /* Light mode overrides */
        @media (prefers-color-scheme: light) {
            .download-card {
                border: 1px solid rgba(0, 0, 0, 0.1);
            }

            .editor-card {
                border: 1px solid rgba(0, 0, 0, 0.1);
            }

            .build-source {
                border: 1px solid rgba(0, 0, 0, 0.1);
            }

            .build-source code {
                background: rgba(0, 0, 0, 0.08);
            }

            .code-block {
                background: rgba(30, 41, 59, 0.95);
            }

            .editor-section {
                background: rgba(5, 150, 105, 0.05);
                border: 1px solid rgba(5, 150, 105, 0.15);
            }
        }
    </style>
</head>
<body>
{{ <inner> }}</body>
</html>
