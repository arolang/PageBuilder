<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ <el: title> }}</title>
{{ Include the <result> from the <template: atoms/head_meta.html>. }}
    <style>
        /* Getting Started specific styles (extends subpage.css) */
        .guide-content {
            max-width: 900px;
            margin: 0 auto;
            padding: var(--space-2xl) var(--space-lg);
        }

        .step {
            margin-bottom: 60px;
            padding-bottom: 60px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .step:last-child {
            border-bottom: none;
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .step-number {
            width: 48px;
            height: 48px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .step h2 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .step p {
            font-size: 1.1rem;
            color: var(--color-text-muted);
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .step code {
            font-family: var(--font-mono);
            background: var(--color-bg-alt);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .code-block {
            background: var(--color-bg-alt);
            border-radius: var(--radius-md);
            overflow: hidden;
            margin: 24px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .code-block-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            gap: 8px;
        }

        .code-block-header .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .code-block-header .dot.red { background: #ff5f56; }
        .code-block-header .dot.yellow { background: #ffbd2e; }
        .code-block-header .dot.green { background: #27ca40; }

        .code-block-title {
            margin-left: auto;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }

        .code-block pre {
            padding: 20px;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        .code-block .comment { color: #6b7280; }
        .code-block .keyword { color: #7c3aed; }
        .code-block .string { color: #10b981; }
        .code-block .action { color: #7c3aed; font-weight: 600; }
        .code-block .result { color: #06b6d4; }
        .code-block .feature { color: #f472b6; }

        .terminal {
            background: #1a1a2e;
            border-radius: var(--radius-md);
            padding: 20px;
            margin: 24px 0;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .terminal-prompt {
            color: #10b981;
        }

        .terminal-command {
            color: var(--color-text);
        }

        .terminal-output {
            color: var(--color-text-muted);
            margin-top: 12px;
        }

        .file-tree {
            background: var(--color-bg-alt);
            border-radius: var(--radius-md);
            padding: 24px;
            margin: 24px 0;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .file-tree-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            color: var(--color-text-muted);
        }

        .file-tree-item.folder { color: var(--color-secondary); }
        .file-tree-item.file-yaml { color: var(--color-warning); }
        .file-tree-item.file-aro { color: var(--color-accent); }

        .file-tree-item.indent-1 { padding-left: 24px; }
        .file-tree-item.indent-2 { padding-left: 48px; }

        .tip {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--color-success);
            padding: 20px 24px;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            margin: 24px 0;
        }

        .tip-title {
            font-weight: 600;
            color: var(--color-success);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tip p {
            margin-bottom: 0;
            font-size: 1rem;
        }

        .next-steps {
            background: var(--color-bg-alt);
            border-radius: var(--radius-lg);
            padding: 40px;
            margin-top: 60px;
            text-align: center;
        }

        .next-steps h3 {
            font-size: 1.5rem;
            margin-bottom: 16px;
        }

        .next-steps p {
            color: var(--color-text-muted);
            margin-bottom: 24px;
        }

        .next-links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Light mode overrides */
        @media (prefers-color-scheme: light) {
            .step {
                border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            }

            .code-block {
                border: 1px solid rgba(0, 0, 0, 0.1);
            }

            .code-block-header {
                background: rgba(0, 0, 0, 0.05);
                border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            }

            .code-block .comment { color: #6b7280; }
            .code-block .keyword { color: #6d28d9; }
            .code-block .string { color: #059669; }
            .code-block .action { color: #6d28d9; }
            .code-block .result { color: #0891b2; }
            .code-block .feature { color: #be185d; }

            .terminal {
                background: #1e293b;
            }

            .terminal-command {
                color: #e2e8f0;
            }

            .terminal-output {
                color: #94a3b8;
            }

            .file-tree {
                border: 1px solid rgba(0, 0, 0, 0.1);
            }

            .tip {
                background: rgba(5, 150, 105, 0.08);
            }
        }
    </style>
</head>
<body>
{{ <inner> }}</body>
</html>
