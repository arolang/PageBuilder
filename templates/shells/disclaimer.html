<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ <el: title> }}</title>
{{ Include the <result> from the <template: atoms/head_meta.html>. }}
    <style>
        .page-content {
            max-width: 850px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .section-divider {
            text-align: center;
            margin: 80px 0 60px;
            position: relative;
        }

        .section-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        .section-divider span {
            background: var(--color-bg);
            padding: 0 24px;
            position: relative;
            font-size: 0.9rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .motivation-section {
            margin-bottom: 48px;
            padding: 32px;
            background: var(--color-bg-alt);
            border-radius: var(--radius-lg);
            border-left: 4px solid var(--color-primary);
        }

        .motivation-section.accent-cyan {
            border-left-color: var(--color-secondary);
        }

        .motivation-section.accent-green {
            border-left-color: var(--color-success);
        }

        .motivation-section.accent-pink {
            border-left-color: #f472b6;
        }

        .motivation-section h3 {
            font-size: 1.4rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .motivation-section p {
            color: var(--color-text-muted);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 16px;
        }

        .motivation-section p:last-child {
            margin-bottom: 0;
        }

        .motivation-section em {
            color: var(--color-secondary);
            font-style: italic;
        }

        .motivation-section strong {
            color: var(--color-text);
        }

        .section-icon {
            font-size: 1.5rem;
        }

        .quote-block {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.1), rgba(6, 182, 212, 0.1));
            border-radius: var(--radius-lg);
            padding: 32px;
            margin: 32px 0;
            text-align: center;
        }

        .quote-block blockquote {
            font-size: 1.3rem;
            font-style: italic;
            color: var(--color-text);
            margin: 0;
            line-height: 1.6;
        }

        .quote-block .attribution {
            margin-top: 16px;
            font-size: 0.95rem;
            color: var(--color-text-muted);
        }

        .warning-banner {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(245, 158, 11, 0.1));
            border: 2px solid rgba(239, 68, 68, 0.5);
            border-radius: var(--radius-lg);
            padding: 32px;
            margin-bottom: 48px;
            text-align: center;
        }

        .warning-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .warning-banner h2 {
            font-size: 1.5rem;
            color: #ef4444;
            margin-bottom: 12px;
        }

        .warning-banner p {
            color: var(--color-text-muted);
            font-size: 1.1rem;
        }

        .disclaimer-section {
            margin-bottom: 32px;
            padding: 28px;
            background: var(--color-bg-alt);
            border-radius: var(--radius-lg);
            border-left: 4px solid #ef4444;
        }

        .disclaimer-section h3 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .disclaimer-section p {
            color: var(--color-text-muted);
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 0;
        }

        .key-points {
            display: grid;
            gap: 24px;
            margin-top: 48px;
        }

        .key-point {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .key-point-icon {
            font-size: 2rem;
            flex-shrink: 0;
        }

        .key-point-content h4 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .key-point-content p {
            color: var(--color-text-muted);
            margin-bottom: 0;
        }

        .final-note {
            text-align: center;
            padding: 40px;
            margin-top: 48px;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.1), rgba(6, 182, 212, 0.1));
            border-radius: var(--radius-lg);
        }

        .final-note h3 {
            font-size: 1.3rem;
            margin-bottom: 16px;
        }

        .final-note p {
            color: var(--color-text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        .vision-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 32px;
        }

        .vision-card {
            padding: 24px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .vision-card .icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .vision-card h4 {
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .vision-card p {
            font-size: 0.95rem;
            color: var(--color-text-muted);
            margin: 0;
        }

        /* Light mode overrides */
        @media (prefers-color-scheme: light) {
            .section-divider::before {
                background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.15), transparent);
            }

            .key-point {
                background: rgba(0, 0, 0, 0.02);
                border: 1px solid rgba(0, 0, 0, 0.08);
            }

            .vision-card {
                background: rgba(0, 0, 0, 0.02);
                border: 1px solid rgba(0, 0, 0, 0.08);
            }
        }
    </style>
</head>
<body>
{{ <inner> }}</body>
</html>
