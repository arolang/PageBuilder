<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ <el: title> }}</title>
{{ Include the <result> from the <template: atoms/head_meta.html>. }}
    <style>
        /* Docs-specific styles (extends subpage.css) */
        .docs-content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .docs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .doc-card {
            background: var(--color-bg-alt);
            border-radius: var(--radius-lg);
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .doc-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-glow);
        }

        .doc-card-icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }

        .doc-card h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--color-text);
        }

        .doc-card p {
            font-size: 1rem;
            color: var(--color-text-muted);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .doc-card-link {
            color: var(--color-primary);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .section-header {
            margin-bottom: 32px;
        }

        .section-header h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .section-header p {
            color: var(--color-text-muted);
            font-size: 1.1rem;
        }

        .quick-links {
            background: var(--color-bg-alt);
            border-radius: var(--radius-lg);
            padding: 40px;
            margin-bottom: 60px;
        }

        .quick-links h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--color-text-muted);
        }

        .quick-links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .quick-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--color-bg);
            border-radius: var(--radius-md);
            text-decoration: none;
            color: var(--color-text);
            font-weight: 500;
            transition: background 0.2s;
        }

        .quick-link:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .quick-link-icon {
            font-size: 1.2rem;
        }

        /* Light mode overrides */
        @media (prefers-color-scheme: light) {
            .doc-card {
                border: 1px solid rgba(0, 0, 0, 0.08);
            }

            .quick-link:hover {
                background: rgba(0, 0, 0, 0.05);
            }
        }
    </style>
</head>
<body>
{{ <inner> }}</body>
</html>
