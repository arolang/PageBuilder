    <header class="hero">
        <div class="hero-bg" data-parallax="0.3"></div>
        <div class="hero-inner">
        <div class="hero-content">
            <div class="hero-badge">{{ <root: hero_badge> }}</div>
            <h1 class="hero-title">
                <span class="typewriter-line-1"><span class="typewriter-cursor">|</span></span>
                <span class="typewriter-line-2"></span>
            </h1>
            <p class="hero-subtitle">
                {{ <root: hero_subtitle> }}
            </p>
            <div class="hero-cta">
{{ for each <btn> in <root: hero_buttons> { }}                <a href="{{ <btn: href> }}" class="{{ <btn: class> }}">{{ <btn: inner> }}</a>
{{ } }}            </div>
        </div>
        <div class="hero-diagram" data-parallax="-0.1">
            <svg class="plugin-diagram" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Animated dash pattern -->
                    <pattern id="flowUp" patternUnits="userSpaceOnUse" width="10" height="10">
                        <line x1="0" y1="10" x2="0" y2="0" stroke="#00ff88" stroke-width="2" stroke-dasharray="4 6">
                            <animate attributeName="y1" values="10;0" dur="0.5s" repeatCount="indefinite"/>
                            <animate attributeName="y2" values="0;-10" dur="0.5s" repeatCount="indefinite"/>
                        </line>
                    </pattern>
                </defs>

                <!-- Binary box at top -->
                <g class="binary-node">
                    <rect x="150" y="20" width="100" height="40" rx="6" fill="none" stroke="#00ff88" stroke-width="2"/>
                    <text x="200" y="46" text-anchor="middle" fill="#00ff88" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">Binary</text>
                </g>

                <!-- ARO box in center -->
                <g class="aro-node">
                    <rect x="125" y="120" width="150" height="60" rx="8" fill="#0a0a0a" stroke="#00ff88" stroke-width="2"/>
                    <text x="200" y="158" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700">ARO</text>
                </g>

                <!-- Line from ARO to Binary -->
                <line x1="200" y1="120" x2="200" y2="60" class="flow-line flow-to-binary" stroke="#00ff88" stroke-width="2" stroke-dasharray="6 4"/>

                <!-- Arrow head to binary -->
                <polygon points="200,62 195,72 205,72" fill="#00ff88" class="arrow-head"/>

                <!-- Plugin languages at bottom -->
                <g class="plugin-labels" font-family="JetBrains Mono, monospace" font-size="12">
                    <text x="30" y="290" text-anchor="middle" class="plugin-label" data-plugin="cpp">C++</text>
                    <text x="95" y="290" text-anchor="middle" class="plugin-label" data-plugin="swift">Swift</text>
                    <text x="160" y="290" text-anchor="middle" class="plugin-label" data-plugin="rust">Rust</text>
                    <text x="225" y="290" text-anchor="middle" class="plugin-label" data-plugin="aro">ARO</text>
                    <text x="290" y="290" text-anchor="middle" class="plugin-label" data-plugin="python">Python</text>
                    <text x="360" y="290" text-anchor="middle" class="plugin-label" data-plugin="c">C</text>
                </g>

                <!-- Lines from plugins to ARO -->
                <g class="plugin-lines">
                    <!-- C++ -->
                    <path d="M30,275 Q30,220 140,180" class="flow-line flow-plugin" data-plugin="cpp" fill="none" stroke-dasharray="4 4"/>
                    <!-- Swift -->
                    <path d="M95,275 Q95,230 150,180" class="flow-line flow-plugin" data-plugin="swift" fill="none" stroke-dasharray="4 4"/>
                    <!-- Rust -->
                    <path d="M160,275 Q160,240 175,180" class="flow-line flow-plugin" data-plugin="rust" fill="none" stroke-dasharray="4 4"/>
                    <!-- ARO -->
                    <path d="M225,275 L225,180" class="flow-line flow-plugin" data-plugin="aro" fill="none" stroke-dasharray="4 4"/>
                    <!-- Python -->
                    <path d="M290,275 Q290,230 250,180" class="flow-line flow-plugin" data-plugin="python" fill="none" stroke-dasharray="4 4"/>
                    <!-- C -->
                    <path d="M360,275 Q360,220 260,180" class="flow-line flow-plugin" data-plugin="c" fill="none" stroke-dasharray="4 4"/>
                </g>
            </svg>
            <p class="diagram-caption">{{ <root: hero_diagram_caption> }}</p>
        </div>
        </div><!-- /.hero-inner -->
    </header>
